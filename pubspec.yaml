name: saham_teori
description: Grafik saham IDX dengan deteksi teori analisis teknikal.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0
  open_filex: ^4.5.0
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.9.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0C3638"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true
